<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Afmeld mails · Energida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap">
<!-- AFMELDING (Ida 23/10 »Sendes + står på kortet«): linket i hver mail fra Backstage › Mails lander her.
     Siden selv gør intet ved at blive åbnet (mailprogrammers linktjek må ikke afmelde nogen) — først knappen kalder mail-afmeld. -->
<style>
  body { margin:0; background:#F4F2EE; color:#000; font-family:"Poppins",Helvetica,Arial,sans-serif; font-weight:400; }
  .wrap { max-width:480px; margin:0 auto; padding:48px 16px; display:flex; flex-direction:column; align-items:center; gap:24px; }
  .logo { width:72px; height:auto; }
  .fl { background:#fff; border-radius:20px; box-shadow:0 0 4px rgba(46,44,41,.10), 0 0 36px rgba(46,44,41,.14); padding:24px 22px; width:100%; box-sizing:border-box; }
  .eti { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#9A9590; }
  .streg { border-top:1px solid #DEDAD4; margin:10px 0 14px; }
  p { margin:0; font-size:15px; line-height:1.6; }
  button { margin-top:20px; width:100%; height:52px; border:0; border-radius:999px; background:#FC2404; color:#fff; font:inherit; font-size:15px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .lille { margin-top:14px; font-size:12.5px; color:#6F6B66; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/mail/logo.png" alt="Energida">
  <div class="fl">
    <div class="eti">Mails fra Energida</div><div class="streg"></div>
    <p id="tekst">Tryk på knappen, så får du ikke flere mails fra Energida.</p>
    <button type="button" id="knap">Afmeld</button>
  </div>
  <div class="lille">Kontakt@energida.dk</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), e = q.get("e") || "", t = q.get("t") || "";
  var tekst = document.getElementById("tekst"), knap = document.getElementById("knap");
  var fejl = function () { tekst.textContent = "Linket virker ikke. Skriv til Kontakt@energida.dk, så afmelder vi dig."; knap.style.display = "none"; };
  if (!e || !t) { fejl(); return; }
  knap.onclick = function () {
    knap.disabled = true; knap.textContent = "Afmelder …";
    fetch("https://eikcvvppuphnananxcvp.supabase.co/functions/v1/mail-afmeld", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ e: e, t: t }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); tekst.textContent = "Du er afmeldt. Du får ikke flere mails fra Energida."; knap.style.display = "none"; })
      .catch(function () { knap.disabled = false; knap.textContent = "Afmeld"; fejl(); });
  };
})();
</script>
</body>
</html>
